<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>宴 -EN-</title>
    <link rel="stylesheet" href="./assets/en.css" />
    <style>
      /*
       * 要素の ID とクラス名は app.js / vc.js / chat.js が参照しているため変えない。
       * 表示の出し分けは .hidden（en.css）で行う。ID セレクタに display を書くと
       * .hidden より詳細度が勝ってしまうので、ここでも display は書かない。
       */
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 22px 22px 60px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      /* ── ヘッダー ── */
      #account-status {
        font-size: 12.5px;
        color: var(--muted);
      }

      #login-link,
      #profile-link,
      #logout {
        padding: 7px 15px;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--panel-3);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
      }

      #login-link:hover,
      #profile-link:hover,
      #logout:hover {
        border-color: var(--gold-3);
        text-decoration: none;
      }

      /* ── 入店前（ホーム＝お座敷一覧） ── */
      .home {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .home-bar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 18px;
        padding: 18px 20px 6px;
      }

      .home-bar .field {
        margin-bottom: 12px;
      }

      .entry-join {
        display: flex;
        gap: 10px;
      }

      .entry-join .input {
        font-family: var(--serif);
        letter-spacing: 0.3em;
      }

      .entry-join .btn {
        flex: none;
        font-family: var(--serif);
        letter-spacing: 0.4em;
        text-indent: 0.4em;
      }

      /* 卓を立てる。ふだんは畳んでおく副導線 */
      .make {
        grid-column: 1 / -1;
        border-top: 1px solid var(--line-soft);
        margin: 0 -20px;
      }

      .make summary {
        padding: 11px 20px;
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
        list-style: none;
      }

      .make summary::-webkit-details-marker {
        display: none;
      }

      .make summary::after {
        content: "＋";
        float: right;
        color: var(--gold-3);
      }

      .make[open] summary::after {
        content: "−";
      }

      .make summary:hover {
        color: var(--cream);
      }

      .make-body {
        padding: 2px 20px 16px;
      }

      .home-head {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 14px;
        margin: 12px 0 2px;
      }

      .home-head h1 {
        font-family: var(--serif);
        font-size: 26px;
        font-weight: 400;
        margin: 0;
        color: var(--cream);
        letter-spacing: 0.04em;
      }

      #rooms-count {
        font-size: 12.5px;
      }

      #rooms-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 18px;
      }

      .rooms-empty {
        grid-column: 1 / -1;
        margin: 0;
        padding: 40px 20px;
        text-align: center;
        font-size: 13px;
        color: var(--dim);
        border: 1px dashed var(--line);
        border-radius: var(--r-lg);
      }

      .room {
        display: flex;
        flex-direction: column;
        padding: 16px 18px 0;
        overflow: hidden;
      }

      .room-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }

      .room-code {
        font-family: var(--serif);
        font-size: 12px;
        letter-spacing: 0.22em;
        color: var(--muted);
      }

      .room h2 {
        font-family: var(--serif);
        font-size: 19px;
        font-weight: 400;
        margin: 0 0 8px;
        color: var(--cream);
        overflow-wrap: anywhere;
      }

      .room-meta {
        margin: 0 0 16px;
        font-size: 12.5px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .room-seats {
        margin-bottom: 16px;
        font-size: 12.5px;
        color: var(--muted);
      }

      .room-foot {
        display: flex;
        align-items: stretch;
        margin: auto -18px 0;
        border-top: 1px solid var(--line-soft);
      }

      .room-foot .btn {
        flex: 1;
        border: none;
        border-radius: 0;
        font-family: var(--serif);
        letter-spacing: 0.4em;
        text-indent: 0.4em;
        padding: 13px;
      }

      .room-since {
        display: flex;
        align-items: center;
        padding: 0 14px;
        font-size: 11.5px;
        color: var(--dim);
        white-space: nowrap;
      }

      /* ── 入店後 ── */
      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 344px;
        gap: 18px;
        align-items: start;
      }

      /* 卓に着いていない間は帯ごと畳む */
      .stage:has(#room.hidden) {
        display: none;
      }

      .stage-main,
      .stage-side {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-width: 0;
      }

      .block {
        padding: 16px 18px 18px;
      }

      .block > h2 {
        font-family: var(--serif);
        font-size: 17px;
        font-weight: 400;
        margin: 0 0 12px;
        color: var(--cream);
      }

      .block-head {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 14px;
      }

      .block-head h2 {
        font-family: var(--serif);
        font-size: 17px;
        font-weight: 400;
        margin: 0;
        color: var(--cream);
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .row > label {
        font-size: 12px;
        color: var(--muted);
      }

      .row .btn,
      .row .input {
        padding: 8px 14px;
        font-size: 13px;
      }

      .row .input {
        width: auto;
        flex: 1;
        min-width: 120px;
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      button:disabled:hover {
        border-color: var(--line);
        background: var(--panel-3);
      }

      /* 卓上（VC / カメラ）。枠は vc.js が .vc-peer として差し込む */
      #vc-status {
        font-size: 11.5px;
        color: var(--muted);
        margin: 0;
        flex-basis: 100%;
        order: 9;
      }

      /* 品質劣化時の映像自動停止（§3.6）。異常ではないのでエラー表示とは別枠にする */
      #vc-quality:empty {
        display: none;
      }

      #vc-quality {
        margin: 0 0 12px;
        padding: 9px 14px;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.02);
        font-size: 12px;
        color: var(--muted);
      }

      .vc-quality-row {
        margin-bottom: 12px;
      }

      #vc-quality-mode {
        font-size: 11.5px;
      }

      /* 回復済みで再開を勧められる状態のときだけ目立たせる。
         display は書かない（app.js が .hidden で出し分けるため） */
      #vc-resume.vc-resume-ready {
        border-color: var(--green);
        color: var(--cream);
        font-weight: 700;
      }

      #vc-media {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
        gap: 12px;
      }

      #vc-media:empty::after {
        content: "まだ誰も声を入れていません";
        padding: 34px 0;
        text-align: center;
        font-size: 12px;
        color: var(--dim);
      }

      .vc-peer {
        position: relative;
        aspect-ratio: 4 / 3;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: linear-gradient(180deg, #191108, #120c07);
        overflow: hidden;
      }

      /* カメラが切のあいだの下敷き。映像が来ると video が上に重なる */
      .vc-peer::before {
        content: "CAMERA";
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--serif);
        font-size: 12px;
        letter-spacing: 0.3em;
        color: #4a3c2c;
      }

      .vc-self {
        border-color: var(--gold-3);
      }

      .vc-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
        z-index: 1;
      }

      .vc-video[hidden] {
        display: none;
      }

      .vc-peer-label {
        position: relative;
        z-index: 2;
        margin: 0;
        padding: 9px 11px;
        font-family: var(--serif);
        font-size: 13px;
        color: var(--cream);
        background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.72));
      }

      /* フェーズ表示 */
      #phase-title {
        font-family: var(--serif);
        font-size: 18px;
        font-weight: 400;
        margin: 0 0 4px;
        color: var(--cream);
      }

      #phase-deadline {
        margin: 0 0 12px;
        font-size: 11.5px;
        color: var(--gold-3);
      }

      #phase-body p {
        margin: 0 0 10px;
        color: var(--text);
      }

      #phase-body ul {
        list-style: none;
        margin: 0 0 10px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #phase-body li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border: 1px solid var(--line-soft);
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.015);
      }

      #phase-body li > span {
        flex: 1;
        overflow-wrap: anywhere;
      }

      #phase-body button {
        padding: 8px 16px;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--panel-3);
        color: var(--text);
        cursor: pointer;
      }

      #phase-body button:hover {
        border-color: var(--gold-3);
      }

      #phase-body input {
        flex: 1;
        min-width: 160px;
        padding: 10px 13px;
        margin-right: 8px;
        background: #150e08;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        color: var(--cream);
        outline: none;
      }

      /* 順位表 */
      #result-title {
        font-family: var(--serif);
        font-size: 17px;
        font-weight: 400;
        margin: 0 0 12px;
        color: var(--cream);
      }

      #result-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      #result-list li {
        padding: 10px 2px;
        border-bottom: 1px solid var(--line-soft);
        font-variant-numeric: tabular-nums;
      }

      /* 呑み手一覧 */
      #room-code {
        font-family: var(--serif);
        letter-spacing: 0.22em;
        color: var(--gold-2);
      }

      #room-meta {
        margin: 0 0 14px;
        font-size: 11.5px;
        color: var(--muted);
      }

      #players {
        list-style: none;
        margin: 0 0 16px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      #players li {
        padding: 8px 12px;
        border: 1px solid var(--line-soft);
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.015);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      #lobby-controls {
        margin-bottom: 10px;
      }

      #leave {
        margin-left: auto;
      }

      /* やりとり（チャット） */
      #chat {
        display: flex;
        flex-direction: column;
        min-height: 300px;
        max-height: 460px;
      }

      #chat-log {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        list-style: none;
        margin: 0 0 12px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #chat-log li {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 7px;
      }

      #chat-log .chat-nickname {
        order: 1;
        font-size: 12.5px;
        color: var(--gold-2);
      }

      #chat-log .chat-badge-bot {
        order: 2;
        padding: 1px 6px;
        border: 1px solid #4b5b3d;
        border-radius: var(--r-sm);
        font-size: 10px;
        color: #9fb886;
      }

      #chat-log .chat-time {
        order: 3;
        font-size: 11px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }

      /* 本文（chat.js が class 無しの span で入れる最後の子） */
      #chat-log li > span:last-child {
        order: 4;
        flex-basis: 100%;
        font-size: 13.5px;
        color: var(--text);
        line-height: 1.75;
        overflow-wrap: anywhere;
      }

      #chat-log li.chat-bot .chat-nickname {
        color: #9fb886;
      }

      #chat-log li.chat-self .chat-nickname {
        color: var(--cream);
      }

      #chat-form {
        display: flex;
        gap: 8px;
      }

      #chat-form .input {
        flex: 1;
        min-width: 0;
      }

      #chat-send {
        flex: none;
      }

      /* 通信ログ（開発用） */
      .devlog {
        border: 1px solid var(--line-soft);
        border-radius: var(--r-md);
      }

      .devlog summary {
        padding: 9px 14px;
        font-size: 12px;
        color: var(--dim);
        cursor: pointer;
      }

      #log {
        max-height: 13rem;
        overflow-y: auto;
        padding: 8px 14px 12px;
        border-top: 1px solid var(--line-soft);
        font-size: 11px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--dim);
      }

      @media (max-width: 900px) {
        .stage {
          grid-template-columns: 1fr;
        }
        #chat {
          max-height: none;
        }
      }

      @media (max-width: 640px) {
        .home-bar {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header id="account" class="appbar">
      <span class="brand">宴 -EN-</span>
      <span class="spacer"></span>
      <span id="account-status">確認中…</span>
      <a id="login-link" href="/login.html" class="hidden">のれんをくぐる</a>
      <a id="profile-link" href="/profile.html" class="hidden">身支度</a>
      <button id="logout" type="button" class="hidden">暖簾を出る</button>
    </header>

    <main>
      <p id="error" class="alert" role="alert"></p>

      <section id="entry" class="home">
        <div class="card home-bar">
          <div class="field">
            <label for="nickname">あだ名（20文字以内）</label>
            <input class="input" id="nickname" maxlength="20" autocomplete="off" />
          </div>

          <div class="field">
            <label for="code">参加コード（数字6桁）</label>
            <div class="entry-join">
              <input
                class="input"
                id="code"
                inputmode="numeric"
                maxlength="6"
                autocomplete="off"
                placeholder="123456"
              />
              <button id="join" class="btn" type="button">入店</button>
            </div>
          </div>

          <details class="make">
            <summary>卓を立てる（要ログイン）</summary>
            <div class="make-body">
              <div class="field">
                <label for="room-name">卓の名前（20文字以内）</label>
                <input
                  class="input"
                  id="room-name"
                  maxlength="20"
                  autocomplete="off"
                  placeholder="金曜の反省会"
                />
              </div>
              <div class="field">
                <label for="room-description">説明文（100文字以内・任意）</label>
                <textarea
                  class="input"
                  id="room-description"
                  maxlength="100"
                  rows="2"
                  placeholder="今夜は焼酎の会です"
                ></textarea>
              </div>
              <div class="field">
                <label>タグ（最大5個・任意）</label>
                <div id="room-tags" class="room-tags-picker"></div>
              </div>
              <div class="field">
                <label for="visibility">誰に見せるか</label>
                <select class="input" id="visibility">
                  <option value="public">お座敷一覧に出す（誰でも入店できる）</option>
                  <option value="private">一覧に出さない（コードを知っている人だけ）</option>
                </select>
              </div>
              <button id="create" class="btn btn-gold btn-block" type="button">卓を立てる</button>
            </div>
          </details>
        </div>

        <div class="home-head">
          <h1>今夜、灯りのついている卓</h1>
          <span id="rooms-count" class="muted">読み込んでいます…</span>
        </div>

        <div id="rooms-list"></div>

        <p class="notice">
          合言葉・承認制（ノック）・ランダムマッチ（いますぐ飲む）はまだ実装されていません。
          一覧に出ている卓へは承認なしでそのまま入店できます。
        </p>
      </section>

      <div class="stage">
        <div class="stage-main">
          <section id="vc" class="card block hidden">
            <div class="block-head">
              <h2>卓上</h2>
              <span class="spacer"></span>
              <button id="vc-join" class="btn" type="button">VCに参加</button>
              <button id="vc-mute" class="btn" type="button">ミュート</button>
              <button id="vc-camera" class="btn" type="button">カメラON</button>
              <button id="vc-transcribe" class="btn" type="button">文字起こしON</button>
              <button id="vc-leave" class="btn" type="button">VC退出</button>
              <p id="vc-status">未参加</p>
            </div>
            <!-- 品質劣化時の映像自動停止（§3.6）。通知文言と再開操作 -->
            <p id="vc-quality" role="status"></p>
            <div class="row vc-quality-row">
              <button id="vc-resume" type="button" class="btn hidden">カメラを再開</button>
              <!-- 判定モードの表示。iOS Safari 実機ではコンソールを見られないため画面に出す -->
              <span id="vc-quality-mode" class="dim"></span>
            </div>
            <!-- 通話の文字起こし（自分の声のみ・既定OFF）。docs/design/bot-voice.md §5.4 -->
            <p id="voice-caption" class="dim voice-caption" aria-live="polite"></p>
            <div id="vc-media"></div>
          </section>

          <section id="bot" class="card block hidden"></section>

          <!-- サンドボックスゲーム（docs/design/game-sandbox.md）。DOM は sandbox.js が自前で組み立てる -->
          <section id="sandbox" class="card block hidden"></section>

          <section id="phase" class="card block hidden">
            <h2 id="phase-title"></h2>
            <p id="phase-deadline"></p>
            <div id="phase-body"></div>
          </section>

          <section id="result" class="card block hidden">
            <h2 id="result-title"></h2>
            <ul id="result-list"></ul>
          </section>
        </div>

        <aside class="stage-side">
          <section id="room" class="card block hidden">
            <div class="block-head">
              <h2>卓 <span id="room-code"></span></h2>
            </div>
            <p id="room-meta"></p>

            <ul id="players"></ul>

            <div class="row" id="lobby-controls">
              <label for="game">ゲーム</label>
              <select class="input" id="game"></select>
              <button id="select-game" class="btn" type="button">選ぶ</button>
              <button id="start" class="btn btn-gold" type="button">はじめる</button>
            </div>
            <div class="row">
              <button id="skip" class="btn" type="button">スキップ（ホスト）</button>
              <button id="leave" class="btn btn-red" type="button">お先に失礼</button>
            </div>
          </section>

          <section id="chat" class="card block hidden">
            <h2>やりとり</h2>
            <ul id="chat-log"></ul>
            <form id="chat-form">
              <input
                class="input"
                id="chat-text"
                maxlength="200"
                autocomplete="off"
                placeholder="ひとこと（200文字まで）"
              />
              <button id="chat-send" class="btn btn-gold" type="button">送る</button>
            </form>
          </section>
        </aside>
      </div>

      <details class="devlog">
        <summary>通信ログ（開発用）</summary>
        <div id="log"></div>
      </details>
    </main>

    <script src="./rooms.js"></script>
    <script src="./room/vc.js"></script>
    <script src="./room/voice.js"></script>
    <script src="./room/chat.js"></script>
    <script src="./room/bot.js"></script>
    <script src="./room/sandbox.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
