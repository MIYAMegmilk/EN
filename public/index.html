<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>宴 -EN-</title>
    <link rel="stylesheet" href="./assets/en.css" />
    <style>
      /*
       * 要素の ID とクラス名は app.js / vc.js / chat.js / bot.js / sandbox.js が
       * 参照しているため変えない。表示の出し分けは .hidden（en.css）で行う。
       * .hidden は !important 付きなので、ID セレクタに display を書いても勝てる。
       *
       * この画面はビューポートに収める。ページ全体はスクロールさせず、
       * 溢れたものは各パネルの内側（#players / #vc-media / #chat-log …）で流す。
       */
      /*
       * 画面全体の下敷き。店内写真（assets/izakaya.jpg）を1枚敷き、
       * 上から暗幕のグラデーションを重ねて薄くする。
       * position: fixed の擬似要素にしているのは、background-attachment: fixed が
       * iOS Safari で拡大・ちらつきを起こすため。z-index: -1 で本文の下に沈める。
       * url() は index.html からの相対パスで解決される。
       */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image:
          linear-gradient(180deg, rgba(16, 11, 7, 0.78), rgba(16, 11, 7, 0.88)),
          url("./assets/izakaya.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      /*
       * 下敷きがうっすら透ける程度に薄くする。透かしすぎると提灯の明かりが
       * 札の裏で光ってしまい、卓名が読みづらくなるので 0.93〜0.96 に留める。
       */
      .appbar {
        flex: none;
        padding: 9px 18px;
        gap: 16px;
        background: rgba(22, 16, 10, 0.82);
        backdrop-filter: blur(6px);
      }

      .home-bar {
        background: linear-gradient(180deg, rgba(43, 32, 22, 0.93), rgba(36, 26, 17, 0.96));
      }

      /*
       * 画面の骨組み。上に細い帯（.appbar）、残り全部が main。
       * 100dvh は iOS のアドレスバー伸縮に追従させるため（100vh だと
       * 隠れた分だけ下が切れる）。html/body の height: 100% は
       * dvh を解さない環境向けの控え。
       */
      html,
      body {
        height: 100%;
      }

      body {
        height: 100dvh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      main {
        flex: 1;
        min-height: 0;
        width: 100%;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* エラーは中身が空なら場所を取らない（en.css の .alert:empty） */
      #error {
        flex: none;
      }

      /* ── ヘッダー ── */
      #account-status {
        font-size: 12.5px;
        color: var(--muted);
      }

      #login-link,
      #profile-link,
      #logout {
        padding: 7px 15px;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--panel-3);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
      }

      #login-link:hover,
      #profile-link:hover,
      #logout:hover {
        border-color: var(--gold-3);
        text-decoration: none;
      }

      /* ── 入店前（ホーム＝お座敷一覧） ── */
      /*
       * 卓の数は読めないので、ここだけは中で流す（ページは動かさない）。
       * 帯いっぱいに広げず 1200px で止めて、札が間延びしないようにする。
       */
      .home {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        display: flex;
        flex-direction: column;
        gap: 18px;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 8px 8px 28px;
      }

      .home-bar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 18px;
        padding: 18px 20px 6px;
      }

      .home-bar .field {
        margin-bottom: 12px;
      }

      .entry-join {
        display: flex;
        gap: 10px;
      }

      .entry-join .input {
        font-family: var(--serif);
        letter-spacing: 0.3em;
      }

      .entry-join .btn {
        flex: none;
        font-family: var(--serif);
        letter-spacing: 0.4em;
        text-indent: 0.4em;
      }

      /* 卓を立てる。ふだんは畳んでおく副導線 */
      .make {
        grid-column: 1 / -1;
        border-top: 1px solid var(--line-soft);
        margin: 0 -20px;
      }

      .make summary {
        padding: 11px 20px;
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
        list-style: none;
      }

      .make summary::-webkit-details-marker {
        display: none;
      }

      .make summary::after {
        content: "＋";
        float: right;
        color: var(--gold-3);
      }

      .make[open] summary::after {
        content: "−";
      }

      .make summary:hover {
        color: var(--cream);
      }

      .make-body {
        padding: 2px 20px 16px;
      }

      .home-head {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 14px;
        margin: 12px 0 2px;
      }

      .home-head h1 {
        font-family: var(--serif);
        font-size: 26px;
        font-weight: 400;
        margin: 0;
        color: var(--cream);
        letter-spacing: 0.04em;
      }

      #rooms-count {
        font-size: 12.5px;
      }

      #rooms-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 18px;
      }

      .rooms-empty {
        grid-column: 1 / -1;
        margin: 0;
        padding: 40px 20px;
        background: rgba(16, 11, 7, 0.62);
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: var(--r-lg);
      }

      /* 下敷きの写真がうっすら透けるよう、卓の札だけ .card より薄い地にする */
      .room {
        display: flex;
        flex-direction: column;
        padding: 16px 18px 0;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(43, 32, 22, 0.93), rgba(36, 26, 17, 0.96));
      }

      .room-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }

      .room-code {
        font-family: var(--serif);
        font-size: 12px;
        letter-spacing: 0.22em;
        color: var(--muted);
      }

      .room h2 {
        font-family: var(--serif);
        font-size: 19px;
        font-weight: 400;
        margin: 0 0 8px;
        color: var(--cream);
        overflow-wrap: anywhere;
      }

      .room-meta {
        margin: 0 0 16px;
        font-size: 12.5px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .room-desc {
        margin: 0 0 12px;
        font-size: 12.5px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .room-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 16px;
      }

      .room-tags-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
      }

      .room-tags-picker label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
      }

      .room-seats {
        margin-bottom: 16px;
        font-size: 12.5px;
        color: var(--muted);
      }

      .room-foot {
        display: flex;
        align-items: stretch;
        margin: auto -18px 0;
        border-top: 1px solid var(--line-soft);
      }

      .room-foot .btn {
        flex: 1;
        border: none;
        border-radius: 0;
        font-family: var(--serif);
        letter-spacing: 0.4em;
        text-indent: 0.4em;
        padding: 13px;
      }

      .room-since {
        display: flex;
        align-items: center;
        padding: 0 14px;
        font-size: 11.5px;
        color: var(--dim);
        white-space: nowrap;
      }

      /* ══ 入店後 ══════════════════════════════════════════════════
       * 3列に組む。左＝卓の情報と進行の操作、中央＝卓上・テロップ・座興、
       * 右＝やりとり。全体の高さはビューポートに固定し、溢れた分は
       * 各パネルの内側（#players / #vc-media / #chat-log …）だけで流す。
       * ページ自体は決してスクロールさせない。
       */
      .stage {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr) 324px;
        gap: 12px;
      }

      /* 卓に着いていない間は帯ごと畳む */
      .stage:has(#room.hidden) {
        display: none;
      }

      .stage-rail,
      .stage-main,
      .stage-side {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      /* 札（パネル）の共通形 */
      .block {
        padding: 12px 14px;
        min-height: 0;
      }

      /*
       * 流れる枠の見た目。既定の太い帯が出ると木目から浮くので細くする。
       * scrollbar-* は Firefox / Chromium が解する（Safari は既定のまま）。
       */
      .home,
      .stage,
      #players,
      #bot,
      .stage-board,
      #vc-media,
      #chat-log,
      #log {
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }

      .block > h2 {
        font-family: var(--serif);
        font-size: 15px;
        font-weight: 400;
        margin: 0 0 10px;
        color: var(--cream);
        letter-spacing: 0.06em;
      }

      .block-head {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }

      .block-head h2 {
        font-family: var(--serif);
        font-size: 15px;
        font-weight: 400;
        margin: 0;
        color: var(--cream);
        letter-spacing: 0.06em;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .row > label {
        font-size: 12px;
        color: var(--muted);
      }

      .row .btn,
      .row .input {
        padding: 8px 14px;
        font-size: 13px;
      }

      .row .input {
        width: auto;
        flex: 1;
        min-width: 120px;
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      button:disabled:hover {
        border-color: var(--line);
        background: var(--panel-3);
      }

      /* ── 左レール：卓の札・呑み手・進行の操作 ──────────────────── */
      #room {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      #room .block-head {
        margin: 0;
      }

      #room-code {
        font-family: var(--serif);
        letter-spacing: 0.22em;
        color: var(--gold-2);
      }

      #room-meta {
        margin: 0;
        font-size: 11.5px;
        line-height: 1.6;
        color: var(--muted);
      }

      /* 呑み手一覧。人が増えたらこの枠の中だけが流れる */
      #players {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      #players li {
        padding: 7px 10px;
        border: 1px solid var(--line-soft);
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.015);
        font-size: 12.5px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      /* レールの足元。呑み手が何人いても、この操作だけは必ず見えている */
      .rail-foot {
        display: flex;
        flex-direction: column;
        gap: 7px;
        margin: 0 -14px -12px;
        padding: 10px 14px 12px;
        border-top: 1px solid var(--line-soft);
        background: rgba(0, 0, 0, 0.18);
      }

      /* ラベルと選択欄を1行ずつ、操作ボタンを2つ横並びにする */
      #lobby-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin: 0;
      }

      #lobby-controls > label {
        grid-column: 1 / -1;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: var(--dim);
      }

      #lobby-controls .input {
        grid-column: 1 / -1;
        width: 100%;
        min-width: 0;
        flex: none;
        padding: 7px 10px;
        font-size: 12.5px;
      }

      .rail-foot .btn {
        flex: 1 1 0;
        padding: 8px 10px;
        font-size: 12.5px;
        white-space: nowrap;
      }

      /* 3列では右端に寄せる意味がない（レールの幅いっぱいに割る） */
      #leave {
        margin-left: 0;
      }

      /* ── 中央：卓上・テロップ・座興 ───────────────────────────── */
      /* しゅんぴたちのテロップ。卓上と座興のあいだに細い帯で挟む */
      #bot {
        flex: 0 0 auto;
        min-height: 0;
        max-height: 32%;
        overflow-y: auto;
        overscroll-behavior: contain;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 9px 12px;
      }

      /* 間は #bot の gap で取るので、部品側の余白は打ち消す */
      #bot .bot-toggles {
        margin-bottom: 0;
      }

      #bot .bot-poll {
        margin-top: 0;
      }

      #bot .bot-card {
        padding: 11px 13px;
      }

      /*
       * 座興の面。本編・余興・順位表をこの一枠にまとめ、伸びたらここだけを流す。
       * 座興が出ていない（＝ロビー）あいだは中身のぶんしか場所を取らないので、
       * 余った高さはそのまま卓上（#vc）が受け取る。
       */
      .stage-board {
        flex: 0 1 auto;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .stage-board > .card {
        flex: none;
      }

      /* フェーズ表示 */
      #phase-title {
        font-family: var(--serif);
        font-size: 16px;
        font-weight: 400;
        margin: 0 0 3px;
        color: var(--cream);
      }

      #phase-deadline:empty {
        display: none;
      }

      #phase-deadline {
        margin: 0 0 10px;
        font-size: 11.5px;
        color: var(--gold-3);
        font-variant-numeric: tabular-nums;
      }

      #phase-body p {
        margin: 0 0 10px;
        color: var(--text);
      }

      #phase-body ul {
        list-style: none;
        margin: 0 0 10px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #phase-body li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 13px;
        border: 1px solid var(--line-soft);
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.015);
      }

      #phase-body li > span {
        flex: 1;
        overflow-wrap: anywhere;
      }

      #phase-body button {
        padding: 8px 16px;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--panel-3);
        color: var(--text);
        cursor: pointer;
      }

      #phase-body button:hover {
        border-color: var(--gold-3);
      }

      #phase-body input {
        flex: 1;
        min-width: 160px;
        padding: 10px 13px;
        margin-right: 8px;
        background: #150e08;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        color: var(--cream);
        outline: none;
      }

      /* 順位表 */
      #result-title {
        font-family: var(--serif);
        font-size: 16px;
        font-weight: 400;
        margin: 0 0 8px;
        color: var(--cream);
      }

      #result-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      #result-list li {
        padding: 9px 2px;
        border-bottom: 1px solid var(--line-soft);
        font-variant-numeric: tabular-nums;
      }

      /* 余興（サンドボックス）。en.css の縦積みを、この画面用に詰める */
      #sandbox .sandbox-head {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px 10px;
      }

      #sandbox .sandbox-head h2 {
        margin: 0;
        font-size: 15px;
      }

      #sandbox .sandbox-note {
        margin: 0;
      }

      #sandbox .sandbox-controls {
        margin: 9px 0 0;
      }

      #sandbox .sandbox-status:empty {
        display: none;
      }

      #sandbox .sandbox-status {
        margin: 7px 0 0;
      }

      #sandbox .sandbox-error {
        margin: 7px 0 0;
      }

      #sandbox .sandbox-frame-slot {
        width: 100%;
        margin-top: 10px;
      }

      #sandbox .sandbox-log-details {
        margin-top: 8px;
      }

      /*
       * 余興が動いていないあいだは、見出しと選択欄だけの1枚に畳む。
       * 動いているかは iframe が挿さっているかで判る
       * （sandbox.js が .sandbox-frame-slot に iframe を出し入れする）。
       */
      #sandbox:not(:has(.sandbox-frame-slot > *)) .sandbox-note,
      #sandbox:not(:has(.sandbox-frame-slot > *)) .sandbox-log-details {
        display: none;
      }

      /* 卓上（VC / カメラ）。枠は vc.js が .vc-peer として差し込む */
      #vc {
        /*
         * 基準を 0 にして「余った高さ」だけを受け取る。auto にすると枠の
         * 高さが基準になり、座興の面まで道連れで縮んで無駄に流れてしまう。
         * min-height は、座興が場所を取っても枠が一列ぶんは残る高さ。
         */
        flex: 1 1 0;
        min-height: 246px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
      }

      .vc-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }

      .vc-head h2 {
        font-family: var(--serif);
        font-size: 15px;
        font-weight: 400;
        margin: 0;
        color: var(--cream);
        letter-spacing: 0.06em;
        white-space: nowrap;
      }

      #vc-status {
        margin: 0;
        min-width: 0;
        font-size: 11.5px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #vc-media {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        display: grid;
        /*
         * auto-fit は空いた列を畳むので、呑み手の数だけ列ができて幅を等分する。
         * ひとりのときに枠が卓いっぱいへ膨らまないよう .vc-peer 側で頭を打つ。
         */
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        justify-items: center;
        /* 人数が少ないうちは上下の真ん中に。溢れたら safe が start に倒す */
        align-content: safe center;
        gap: 10px;
      }

      /* 誰も入っていないときは枠を敷かず、真ん中に一言だけ置く */
      #vc-media:empty {
        grid-template-columns: 1fr;
      }

      #vc-media:empty::after {
        content: "まだ誰も声を入れていません";
        text-align: center;
        font-size: 12px;
        color: var(--dim);
      }

      /*
       * 幅は列（＝呑み手の数）で、高さは枠の高さで頭を打つ。座興が場所を
       * 取って卓上が薄くなったときは 4:3 を諦めて横長に潰す（Zoom の
       * ストリップと同じ。枠ごと切れて見えるより、潰れたほうが読める）。
       */
      .vc-peer {
        position: relative;
        width: 100%;
        max-width: 248px;
        max-height: 100%;
        aspect-ratio: 4 / 3;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: linear-gradient(180deg, #191108, #120c07);
        overflow: hidden;
      }

      /* カメラが切のあいだの下敷き。映像が来ると video が上に重なる */
      .vc-peer::before {
        content: "CAMERA";
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--serif);
        font-size: 11px;
        letter-spacing: 0.3em;
        color: #4a3c2c;
      }

      /*
       * 並び順。人が先、ボットが後。
       * ボットの枠（app.js の renderVcBotTiles）は入店した時点で並び、人の枠は
       * VC がつながってから vc.js が足すので、DOM の順に任せるとボットが
       * 先頭に来てしまう。呑み手の顔を先に見せたいので order で追い越す。
       */
      #vc-media > .vc-peer {
        order: 0;
      }

      #vc-media > .vc-peer-bot {
        order: 1;
      }

      /* 自分の枠はいちばん端に置く（Zoom と同じで、探さなくても目に入る） */
      #vc-media > .vc-self {
        order: -1;
      }

      .vc-self {
        border-color: var(--gold-3);
      }

      .vc-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
        z-index: 1;
      }

      .vc-video[hidden] {
        display: none;
      }

      .vc-peer-label {
        position: relative;
        z-index: 2;
        margin: 0;
        padding: 7px 10px;
        font-family: var(--serif);
        font-size: 12.5px;
        color: var(--cream);
        background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.72));
      }

      /* 品質劣化時の映像自動停止（§3.6）。異常ではないのでエラー表示とは別枠にする */
      #vc-quality:empty {
        display: none;
      }

      #vc-quality {
        margin: 0;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.02);
        font-size: 12px;
        color: var(--muted);
      }

      /*
       * 手元の操作。卓上の札の足元に敷いて、映像のすぐ下に置く。
       * 卓上が中央の先頭なので画面のいちばん下ではないが、「自分の映像の
       * 真下が手元の操作」という並びは Zoom / Meet と同じで、迷わない。
       */
      .vc-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 -12px -10px;
        padding: 8px 12px 10px;
        border-top: 1px solid var(--line-soft);
        background: rgba(0, 0, 0, 0.18);
      }

      .vc-bar .btn {
        padding: 7px 12px;
        font-size: 12.5px;
        white-space: nowrap;
      }

      /*
       * 手元の操作ボタン（Zoom / Meet と同じ、絵が上・文字が下の形）。
       * .btn は使わない。ふだんは地を敷かず、切のときだけ色が乗る作りにしたい。
       */
      .vc-ctl {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 4px;
        min-width: 58px;
        padding: 5px 9px 6px;
        border: 1px solid transparent;
        border-radius: var(--r-md);
        background: none;
        color: var(--text);
        font-size: 10px;
        line-height: 1.2;
        letter-spacing: 0.02em;
        white-space: nowrap;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }

      .vc-ctl:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.07);
        border-color: var(--line);
      }

      .vc-ctl:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      /* 絵はすべて線画。21px でも潰れないよう塗りは使わない */
      .vc-ctl-ico {
        width: 21px;
        height: 21px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* 入／切で絵を差し替える。斜線は「切」の側の <g> にだけ入っている */
      .vc-ctl-ico-off {
        display: none;
      }

      .vc-ctl[data-state="off"] .vc-ctl-ico-on {
        display: none;
      }

      .vc-ctl[data-state="off"] .vc-ctl-ico-off {
        display: inline;
      }

      /*
       * 切のときの色。赤にするのはマイクだけにする（Discord と同じ）。
       * カメラと文字起こしは切が既定の状態で、赤くすると卓に着いた直後から
       * 警告が2つ並んでいるように見えてしまう。斜線だけで足りる。
       */
      .vc-ctl[data-state="off"] {
        color: var(--muted);
      }

      #vc-mute[data-state="off"]:not(:disabled) {
        color: #e79c93;
        background: rgba(176, 42, 36, 0.16);
        border-color: #6d2420;
      }

      #vc-mute[data-state="off"]:not(:disabled):hover {
        background: rgba(176, 42, 36, 0.28);
      }

      .vc-ctl-label {
        display: block;
      }

      /* 判定モードの表示。iOS Safari 実機ではコンソールを見られないため画面に出す */
      #vc-quality-mode:empty {
        display: none;
      }

      #vc-quality-mode {
        font-size: 11px;
      }

      /* 回復済みで再開を勧められる状態のときだけ目立たせる。
         display は書かない（app.js が .hidden で出し分けるため） */
      #vc-resume.vc-resume-ready {
        border-color: var(--green);
        color: var(--cream);
        font-weight: 700;
      }

      /* ── 右：やりとり ─────────────────────────────────────────── */
      #chat {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 12px 14px;
      }

      #chat > h2 {
        margin: 0 0 10px;
      }

      #chat-log {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        list-style: none;
        margin: 0 0 10px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 11px;
      }

      /* 一言も交わされていないうちは、空欄に見えないよう一言置く */
      #chat-log:empty::after {
        content: "まだ何も交わされていません";
        margin: auto;
        font-size: 12px;
        color: var(--dim);
      }

      #chat-log li {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 7px;
      }

      #chat-log .chat-nickname {
        order: 1;
        font-size: 12.5px;
        color: var(--gold-2);
      }

      #chat-log .chat-badge-bot {
        order: 2;
        padding: 1px 6px;
        border: 1px solid #4b5b3d;
        border-radius: var(--r-sm);
        font-size: 10px;
        color: #9fb886;
      }

      #chat-log .chat-time {
        order: 3;
        font-size: 11px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }

      /* 本文（chat.js が class 無しの span で入れる最後の子） */
      #chat-log li > span:last-child {
        order: 4;
        flex-basis: 100%;
        font-size: 13px;
        color: var(--text);
        line-height: 1.7;
        overflow-wrap: anywhere;
      }

      #chat-log li.chat-bot .chat-nickname {
        color: #9fb886;
      }

      #chat-log li.chat-self .chat-nickname {
        color: var(--cream);
      }

      #chat-form {
        display: flex;
        gap: 8px;
      }

      #chat-form .input {
        flex: 1;
        min-width: 0;
      }

      #chat-send {
        flex: none;
      }

      /* 通信ログ（開発用）。画面を食わないよう、畳んだ状態は1行ぶんに収める */
      .devlog {
        flex: none;
        border: 1px solid var(--line-soft);
        border-radius: var(--r-md);
      }

      .devlog summary {
        padding: 5px 12px;
        font-size: 11.5px;
        color: var(--dim);
        cursor: pointer;
      }

      #log {
        max-height: 22vh;
        overflow-y: auto;
        padding: 8px 14px 12px;
        border-top: 1px solid var(--line-soft);
        font-size: 11px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--dim);
      }

      /* 3列を保てる下限まではレールと右欄を細らせて粘る */
      @media (max-width: 1180px) {
        .stage {
          grid-template-columns: 202px minmax(0, 1fr) 278px;
          gap: 10px;
        }
      }

      /*
       * ここから下は3列に足りない。縦積みにして、この帯の中だけを流す
       * （body は固定のままなので、ページごとスクロールはしない）。
       */
      @media (max-width: 900px) {
        .stage {
          display: flex;
          flex-direction: column;
          overflow-y: auto;
          overscroll-behavior: contain;
        }
        .stage-rail,
        .stage-main,
        .stage-side {
          flex: none;
          overflow: visible;
        }
        #room,
        #chat {
          flex: none;
        }
        #players {
          max-height: 30vh;
        }
        #bot,
        .stage-board {
          max-height: none;
          overflow: visible;
        }
        #vc {
          min-height: 260px;
        }
        #chat-log {
          min-height: 200px;
          max-height: 46vh;
        }
      }

      @media (max-width: 640px) {
        .home-bar {
          grid-template-columns: 1fr;
        }
      }
      /*
       * 下敷きの写真は暗いが、提灯や瓶のあたりだけ明るく抜ける。
       * その上に直に乗る文字は en.css の muted / dim のままだと沈むので、
       * この画面に限り明るい色に上げ、黒い影を回して明暗どちらの上でも読めるようにする。
       * 地の濃い部品（札・帯・入力欄）は元のままでよい。
       * 同じセレクタが上にもあるため、打ち消されないよう <style> の最後に置く。
       */
      .home-head h1 {
        color: #fbf3e6;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 14px rgba(0, 0, 0, 0.7);
      }

      #rooms-count {
        color: #dcc7a5;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.7);
      }

      /* 帯状の部品は地を濃くして、下の明るい部分を遮ってから文字を乗せる */
      .notice {
        background: rgba(16, 11, 7, 0.72);
        color: var(--gold-2);
      }

      .alert {
        background: rgba(50, 12, 10, 0.78);
        color: #f6cdc8;
      }

      .devlog {
        background: rgba(16, 11, 7, 0.62);
      }

      .devlog summary {
        color: var(--muted);
      }

    </style>
  </head>
  <body>
    <header id="account" class="appbar">
      <span class="brand">宴 -EN-</span>
      <span class="spacer"></span>
      <span id="account-status">確認中…</span>
      <a id="login-link" href="/login.html" class="hidden">のれんをくぐる</a>
      <a id="profile-link" href="/profile.html" class="hidden">身支度</a>
      <button id="logout" type="button" class="hidden">暖簾を出る</button>
    </header>

    <main>
      <p id="error" class="alert" role="alert"></p>

      <section id="entry" class="home">
        <div class="card home-bar">
          <div class="field">
            <label for="nickname">あだ名（20文字以内・空欄可）</label>
            <!-- 空欄のまま入店すると、しゅんぴが二つ名を付ける（docs/design/bot.md §5） -->
            <input
              class="input"
              id="nickname"
              maxlength="20"
              autocomplete="off"
              placeholder="空欄ならこちらで付けます"
            />
          </div>

          <div class="field">
            <label for="code">参加コード（数字6桁）</label>
            <div class="entry-join">
              <input
                class="input"
                id="code"
                inputmode="numeric"
                maxlength="6"
                autocomplete="off"
                placeholder="123456"
              />
              <button id="join" class="btn" type="button">入店</button>
            </div>
          </div>

          <details class="make">
            <summary>卓を立てる（要ログイン）</summary>
            <div class="make-body">
              <div class="field">
                <label for="room-name">卓の名前（20文字以内）</label>
                <input
                  class="input"
                  id="room-name"
                  maxlength="20"
                  autocomplete="off"
                  placeholder="金曜の反省会"
                />
              </div>
              <div class="field">
                <label for="room-description">説明文（100文字以内・任意）</label>
                <textarea
                  class="input"
                  id="room-description"
                  maxlength="100"
                  rows="2"
                  placeholder="今夜は焼酎の会です"
                ></textarea>
              </div>
              <div class="field">
                <label>タグ（最大5個・任意）</label>
                <div id="room-tags" class="room-tags-picker"></div>
              </div>
              <div class="field">
                <label for="visibility">誰に見せるか</label>
                <select class="input" id="visibility">
                  <option value="public">お座敷一覧に出す（誰でも入店できる）</option>
                  <option value="private">一覧に出さない（コードを知っている人だけ）</option>
                </select>
              </div>
              <button id="create" class="btn btn-gold btn-block" type="button">卓を立てる</button>
            </div>
          </details>
        </div>

        <div class="home-head">
          <h1>今夜、灯りのついている卓</h1>
          <span id="rooms-count" class="muted">読み込んでいます…</span>
        </div>

        <div id="rooms-list"></div>

        <p class="notice">
          合言葉・承認制（ノック）・ランダムマッチ（いますぐ飲む）はまだ実装されていません。
          一覧に出ている卓へは承認なしでそのまま入店できます。
        </p>
      </section>

      <!--
        入店後の画面。左＝卓の札と進行の操作、中央＝卓上・テロップ・座興、
        右＝やりとり。要素の ID は app.js / vc.js / chat.js / bot.js /
        sandbox.js が参照しているので、並べ替えても ID とクラス名は変えない。
      -->
      <div class="stage">
        <aside class="stage-rail">
          <section id="room" class="card block hidden">
            <div class="block-head">
              <h2>卓 <span id="room-code"></span></h2>
            </div>
            <p id="room-meta"></p>

            <ul id="players"></ul>

            <div class="rail-foot">
              <div class="row" id="lobby-controls">
                <label for="game">ゲーム</label>
                <select class="input" id="game"></select>
                <button id="select-game" class="btn" type="button">選ぶ</button>
                <button id="start" class="btn btn-gold" type="button">はじめる</button>
              </div>
              <div class="row">
                <button id="skip" class="btn" type="button">スキップ（ホスト）</button>
                <button id="leave" class="btn btn-red" type="button">お先に失礼</button>
              </div>
            </div>
          </section>
        </aside>

        <div class="stage-main">
          <section id="vc" class="card block hidden">
            <div class="vc-head">
              <h2>卓上</h2>
              <p id="vc-status">未参加</p>
            </div>
            <div id="vc-media"></div>
            <!-- 通話の文字起こし（自分の声のみ・既定OFF）。docs/design/bot-voice.md §5.4 -->
            <p id="voice-caption" class="dim voice-caption" aria-live="polite"></p>
            <!-- 受信した文字起こし（同室の他人・自分）。最新1〜2行のみ。チャット欄には混ぜない -->
            <ul id="voice-lines" class="voice-lines" aria-live="polite"></ul>
            <!-- 品質劣化時の映像自動停止（§3.6）。通知文言 -->
            <p id="vc-quality" role="status"></p>
            <!--
              「VCに参加」「VC退出」は置かない。入店した時点で VC にも参加する
              （app.js の autoJoinVc）。抜けるのは卓ごと＝「お先に失礼」。
            -->
            <!--
              手元の操作（Zoom / Meet の操作バーと同じ形）。
              絵は上、文字は下。切のときは data-state="off" が付き、CSS が
              斜線入りの絵に差し替えて赤みを乗せる（app.js の setVcControl）。
              文字は .vc-ctl-label にだけ入れる。ボタン自身に textContent を
              入れると中の <svg> ごと消えるので、app.js もそちらを触っている。
              外部アイコンは読み込めない（§3.8 CSP）ので絵は inline SVG。
            -->
            <div class="vc-bar">
              <button id="vc-mute" class="vc-ctl" type="button" data-state="on">
                <svg class="vc-ctl-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <g class="vc-ctl-ico-on">
                    <path d="M12 4a2.5 2.5 0 0 1 2.5 2.5v5a2.5 2.5 0 0 1-5 0v-5A2.5 2.5 0 0 1 12 4Z" />
                    <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" />
                  </g>
                  <g class="vc-ctl-ico-off">
                    <path d="M12 4a2.5 2.5 0 0 1 2.5 2.5v5a2.5 2.5 0 0 1-5 0v-5A2.5 2.5 0 0 1 12 4Z" />
                    <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" />
                    <path d="M4 3.5 20 20.5" />
                  </g>
                </svg>
                <span class="vc-ctl-label">ミュート</span>
              </button>
              <button id="vc-camera" class="vc-ctl" type="button" data-state="off">
                <svg class="vc-ctl-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <g class="vc-ctl-ico-on">
                    <rect x="3" y="6.5" width="12" height="11" rx="2.5" />
                    <path d="M15 11.2 20.5 8v8L15 12.8Z" />
                  </g>
                  <g class="vc-ctl-ico-off">
                    <rect x="3" y="6.5" width="12" height="11" rx="2.5" />
                    <path d="M15 11.2 20.5 8v8L15 12.8Z" />
                    <path d="M4 3.5 20 20.5" />
                  </g>
                </svg>
                <span class="vc-ctl-label">カメラON</span>
              </button>
              <button id="vc-transcribe" class="vc-ctl" type="button" data-state="off">
                <svg class="vc-ctl-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <g class="vc-ctl-ico-on">
                    <rect x="2.5" y="5" width="19" height="14" rx="2.5" />
                    <path d="M10 10.8a2.6 2.6 0 1 0 0 2.4M17.5 10.8a2.6 2.6 0 1 0 0 2.4" />
                  </g>
                  <g class="vc-ctl-ico-off">
                    <rect x="2.5" y="5" width="19" height="14" rx="2.5" />
                    <path d="M10 10.8a2.6 2.6 0 1 0 0 2.4M17.5 10.8a2.6 2.6 0 1 0 0 2.4" />
                    <path d="M4 3.5 20 20.5" />
                  </g>
                </svg>
                <span class="vc-ctl-label">文字起こしON</span>
              </button>
              <span class="spacer"></span>
              <!-- 判定モードの表示。iOS Safari 実機ではコンソールを見られないため画面に出す -->
              <span id="vc-quality-mode" class="dim"></span>
              <button id="vc-resume" type="button" class="btn hidden">カメラを再開</button>
            </div>
          </section>

          <section id="bot" class="card block hidden"></section>

          <!--
            座興の面。本編・余興・順位表はまとめてこの一枠の中で流す。
            別々に流すと、どれも中途半端な高さになって卓上まで潰れる。
          -->
          <div class="stage-board">
            <section id="phase" class="card block hidden">
              <h2 id="phase-title"></h2>
              <p id="phase-deadline"></p>
              <div id="phase-body"></div>
            </section>

            <!-- サンドボックスゲーム（docs/design/game-sandbox.md）。DOM は sandbox.js が自前で組み立てる -->
            <section id="sandbox" class="card block hidden"></section>

            <section id="result" class="card block hidden">
              <h2 id="result-title"></h2>
              <ul id="result-list"></ul>
            </section>
          </div>
        </div>

        <aside class="stage-side">
          <section id="chat" class="card block hidden">
            <h2>やりとり</h2>
            <ul id="chat-log"></ul>
            <form id="chat-form">
              <input
                class="input"
                id="chat-text"
                maxlength="200"
                autocomplete="off"
                placeholder="ひとこと（200文字まで）"
              />
              <button id="chat-send" class="btn btn-gold" type="button">送る</button>
            </form>
          </section>
        </aside>
      </div>

      <details class="devlog">
        <summary>通信ログ（開発用）</summary>
        <div id="log"></div>
      </details>
    </main>

    <script src="./rooms.js"></script>
    <script src="./room/vc.js"></script>
    <script src="./room/voice.js"></script>
    <script src="./room/chat.js"></script>
    <script src="./room/bot.js"></script>
    <script src="./room/sandbox.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
