<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>宴 -EN- ログイン</title>
    <link rel="stylesheet" href="./assets/en.css" />
    <style>
      body {
        --noren-h: clamp(280px, 58vh, 500px);
        height: 100vh;
        height: 100svh;
        overflow: hidden;
      }

      /* 暖簾。上部の棒にぶら下がっている見た目にする。画面の上から固定サイズで
         伸ばした背景として敷き、レイアウトのスペース確保には関与させない
         （position: fixed）。これでログイン箱の収まり具合に関係なく、
         暖簾自体の大きさは常に一定になる */
      .noren-wrap {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 0;
        height: var(--noren-h);
        padding: 0 3.5vw;
        display: flex;
        flex-direction: column;
        pointer-events: none;
      }

      /* ぶら下げ棒。布の幅より左右にはみ出させて、太い棒らしく見せる */
      .noren-pole {
        flex: none;
        height: 30px;
        margin: 0 -15px 10px;
        border-radius: 10px;
        background: linear-gradient(180deg, #7a5a34, #4a3319);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
      }

      .noren {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 5px;
        min-height: 0;
      }

      .noren span {
        position: relative;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 20%;
        border-radius: 0 0 3px 3px;
        box-shadow: 0 12px 22px rgba(0, 0, 0, 0.4);
      }

      /* 棒に通す輪 */
      .noren span::before {
        content: "";
        position: absolute;
        top: -16px;
        left: 50%;
        transform: translateX(-50%);
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #2c1f12;
        box-shadow: inset 0 0 0 2px #5a4128;
      }

      .cloth-red {
        background: linear-gradient(180deg, #a8241f, #8d1c18);
      }

      /* 左右の暖簾に入れる白丸で囲んだ一文字 */
      .noren-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2.3em;
        height: 2.3em;
        border: 1.5px solid rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        font-family: var(--serif);
        font-size: 26px;
        font-style: normal;
        color: #fff;
        line-height: 1;
      }

      /* ログインの箱。上端を画面上から10vhの位置に固定するので、スクロール
         せずに常に見える位置に出る。中身が伸びても上端は動かず、bottomは
         指定しないので下方向にだけ伸びる（暖簾に被さってよい） */
      main {
        position: fixed;
        top: 10vh;
        left: 0;
        right: 0;
        z-index: 1;
        display: flex;
        justify-content: center;
        padding: 0 20px;
      }

      .sheet {
        width: 100%;
        max-width: 400px;
        padding: 20px 32px 20px;
        border-radius: var(--r-lg);
        background: linear-gradient(180deg, rgba(44, 32, 22, 0.94), rgba(30, 21, 14, 0.94));
        border: 1px solid var(--line-soft);
        box-shadow: var(--shadow);
      }

      .sheet h1 {
        font-family: var(--serif);
        font-size: 26px;
        margin: 0 0 4px;
        color: var(--cream);
        letter-spacing: 0.05em;
      }

      .lead {
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.7;
        margin: 0 0 10px;
      }

      /* 通知の並び。空のときは余白も出さない（:empty で消える） */
      .messages {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
      }

      .messages:not(:has(> *:not(:empty))) {
        margin-bottom: 0;
      }

      #status {
        color: #a8c58a;
        font-size: 12.5px;
        margin: 0;
      }

      #me-result {
        font-size: 11.5px;
        margin: 0;
      }

      #login-error:not(:empty),
      #register-error:not(:empty) {
        margin-bottom: 10px;
      }

      @media (max-height: 720px) {
        .sheet {
          padding: 18px 28px;
        }

        .field {
          margin-bottom: 10px;
        }

        .input {
          padding: 9px 12px;
        }

        .btn-lg {
          padding: 11px 18px;
        }

        .fineprint {
          margin: 6px 0 8px;
        }

        #login-panel .rule,
        #register-panel .rule {
          margin: 10px 0 8px;
        }
      }

      @media (max-height: 640px) {
        .sheet {
          padding: 14px 24px;
        }

        .sheet h1 {
          font-size: 23px;
        }

        .lead {
          line-height: 1.55;
          margin-bottom: 8px;
        }
      }

      @keyframes noren-split-left {
        to {
          transform: translate(-60px, -40px) rotate(-4deg);
          opacity: 0;
        }
      }

      @keyframes noren-split-center {
        to {
          transform: translateY(-60px) scale(0.9);
          opacity: 0;
        }
      }

      @keyframes noren-split-right {
        to {
          transform: translate(60px, -40px) rotate(4deg);
          opacity: 0;
        }
      }

      @keyframes zoom-forward {
        to {
          transform: scale(1.18);
          opacity: 0.85;
        }
      }

      #enter-overlay {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, rgba(44, 32, 22, 0.98), rgba(20, 14, 9, 0.98));
        opacity: 0;
        pointer-events: none;
        transition: opacity 400ms ease-in;
        z-index: 50;
      }

      body.entering .noren span {
        animation-duration: 500ms;
        animation-timing-function: ease-in;
        animation-fill-mode: forwards;
      }

      body.entering .noren span:nth-child(1) {
        animation-name: noren-split-left;
      }

      body.entering .noren span:nth-child(2) {
        animation-name: noren-split-center;
      }

      body.entering .noren span:nth-child(3) {
        animation-name: noren-split-right;
      }

      body.entering main {
        animation: zoom-forward 1300ms ease-in forwards;
      }

      body.cover #enter-overlay {
        opacity: 1;
        pointer-events: auto;
      }

      /* Three.js の暖簾/扉アニメーションを描画するフルスクリーンステージ。
         WebGL非対応時はJS側でこの要素を使わず、既存のCSSフォールバックに任せる */
      #noren-stage {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: #050302;
        opacity: 0;
        pointer-events: none;
      }

      #noren-stage.visible {
        opacity: 1;
      }

      #noren-stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .fineprint {
        display: block;
        margin: 8px 0 10px;
        font-size: 11.5px;
      }

      /* ログイン⇔新規登録の切り替え。ページ全体を伸ばさず箱の中身だけ差し替える */
      .panel[hidden] {
        display: none;
      }

      #login-panel .rule,
      #register-panel .rule {
        margin: 12px 0 10px;
      }

      .mode-switch {
        display: block;
        width: 100%;
        margin-top: 10px;
        padding: 8px 0 0;
        background: none;
        border: none;
        border-top: 1px solid var(--line-soft);
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        cursor: pointer;
      }

      .mode-switch:hover {
        color: var(--cream);
      }

      @media (max-width: 560px) {
        .noren span {
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body class="wood">
    <div class="noren-wrap" aria-hidden="true">
      <div class="noren-pole"></div>
      <div class="noren">
        <span class="cloth-red"><i class="noren-mark">宴</i></span>
        <span class="cloth-red"></span>
        <span class="cloth-red"><i class="noren-mark">宴</i></span>
      </div>
    </div>
    <main>
      <div class="sheet">
        <h1>いらっしゃい</h1>
        <p class="lead">
          今夜も一杯、どこからでも。<br />
          お名前を書いて暖簾をくぐってください。
        </p>

        <div class="messages">
          <p id="status" role="status"></p>
          <p id="me-result" class="dim"></p>
        </div>

        <section id="login-panel" class="panel">
          <div class="field">
            <label for="login-userid">ユーザーID</label>
            <input
              class="input"
              id="login-userid"
              autocomplete="username"
              maxlength="20"
              placeholder="taro2026"
            />
          </div>
          <div class="field">
            <label for="login-password">パスワード</label>
            <input
              class="input"
              id="login-password"
              type="password"
              autocomplete="current-password"
              maxlength="64"
            />
          </div>
          <p id="login-error" class="alert" role="alert"></p>
          <button id="login" class="btn btn-gold btn-block btn-lg btn-noren" type="button">
            のれんをくぐる
          </button>
          <span class="fineprint dim">パスワードの再発行はできません</span>

          <div class="rule">または</div>

          <a id="guest-link" class="btn btn-block" href="/index.html">ふらっと（ゲスト）で入る</a>

          <button id="show-register" class="mode-switch" type="button">
            はじめての方はこちら（新規登録）
          </button>
        </section>

        <section id="register-panel" class="panel" hidden>
          <div class="field">
            <label for="register-userid">ユーザーID（半角英数 4〜20文字）</label>
            <input class="input" id="register-userid" autocomplete="username" maxlength="20" />
          </div>
          <div class="field">
            <label for="register-password">パスワード（8〜64文字）</label>
            <input
              class="input"
              id="register-password"
              type="password"
              autocomplete="new-password"
              maxlength="64"
            />
          </div>
          <p id="register-error" class="alert" role="alert"></p>
          <button id="register" class="btn btn-gold btn-block btn-lg btn-noren" type="button">
            登録して暖簾をくぐる
          </button>

          <button id="show-login" class="mode-switch" type="button">ログイン画面に戻る</button>
        </section>
      </div>
    </main>

    <div id="noren-stage" aria-hidden="true"></div>
    <div id="enter-overlay" aria-hidden="true"></div>

    <script type="module" src="./login.js"></script>
  </body>
</html>
