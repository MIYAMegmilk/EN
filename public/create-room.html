<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>宴 -EN- 卓を立てる</title>
    <link rel="stylesheet" href="./assets/en.css" />
    <style>
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 26px 20px 60px;
      }

      .sheet {
        padding: 26px 26px 30px;
      }

      .sheet h1 {
        font-family: var(--serif);
        font-size: 24px;
        margin: 0 0 8px;
        color: var(--cream);
        letter-spacing: 0.05em;
      }

      .lead {
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.9;
        margin: 0 0 20px;
      }

      /* 見出しは他の欄の <label> と同じ見た目にする（畳めることは ▶ で示す） */
      #create-room-tags-details > summary {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
        cursor: pointer;
        list-style: revert;
      }

      #create-room-tags-details > summary:hover {
        color: var(--gold-2);
      }

      #create-room-tags-details > summary:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }

      /* 選んだ数。0個のときは JS が空にするので、余白ごと消える */
      #create-room-tags-count:not(:empty) {
        color: var(--gold-2);
        margin-left: 6px;
      }

      #create-room-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        /* 畳んだ状態から開いたときに、見出しとの間が詰まりすぎないように */
        margin-top: 8px;
      }

      #create-room-tags label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border: 1px solid var(--line);
        border-radius: var(--r-pill);
        background: var(--panel-3);
        color: var(--muted);
        font-size: 12.5px;
        cursor: pointer;
        transition: border-color 0.15s, color 0.15s, background 0.15s;
      }

      #create-room-tags label:hover {
        border-color: var(--gold-3);
      }

      #create-room-tags input[type="checkbox"] {
        accent-color: var(--gold);
      }

      #create-room-tags label:has(input:checked) {
        border-color: var(--gold-3);
        background: linear-gradient(180deg, rgba(230, 166, 63, 0.16), rgba(200, 134, 42, 0.1));
        color: var(--gold-2);
      }
    </style>
  </head>
  <body class="wood">
    <header class="appbar">
      <a id="to-index" class="btn" href="/index.html">一覧で選ぶ</a>
      <a id="corridor-link" class="btn" href="/corridor.html">店内を歩く</a>
      <span class="brand">宴 -EN-</span>
      <span class="spacer"></span>
      <a href="/entrance.html" class="btn">入り口に戻る</a>
    </header>

    <main>
      <div class="card sheet">
        <p class="eyebrow">CREATE ROOM</p>
        <h1>卓を立てる</h1>
        <p class="lead">幹事になって、新しい卓を開きます。立てるとすぐにその卓の中へ移動します。</p>

        <p id="error" class="alert" role="alert"></p>

        <div class="field">
          <label for="create-room-nickname">あだ名（20文字以内）</label>
          <input class="input" id="create-room-nickname" maxlength="20" autocomplete="off" />
        </div>
        <div class="field">
          <label for="create-room-name">卓の名前（20文字以内）</label>
          <input
            class="input"
            id="create-room-name"
            maxlength="20"
            autocomplete="off"
            placeholder="金曜の反省会"
          />
        </div>
        <!--
          説明文とタグは「お座敷一覧に出す卓」だけのもの。一覧に出さない卓では
          サーバーへ送る経路そのものが無いので、出しっぱなしにすると書いた内容が
          黙って捨てられる。合言葉欄と同じく、この画面の配線が出し入れする
        -->
        <div class="field" id="create-room-description-field">
          <label for="create-room-description">説明文（100文字以内・任意）</label>
          <textarea
            class="input"
            id="create-room-description"
            maxlength="100"
            rows="2"
            placeholder="今夜は焼酎の会です"
          ></textarea>
        </div>
        <div class="field" id="create-room-tags-field">
          <!-- タグは20個以上あって縦に伸びるので、既定では畳んでおく。
               畳んでいる間も選んだ数は見出しに出す（開かないと分からない、を防ぐ）。
               details なので JS 無しで開閉でき、キーボードでも操作できる -->
          <details id="create-room-tags-details">
            <summary>
              タグ（最大5個・任意）<span id="create-room-tags-count"></span>
            </summary>
            <div id="create-room-tags"></div>
          </details>
        </div>
        <div class="field">
          <label for="create-room-visibility">誰に見せるか</label>
          <select class="input" id="create-room-visibility">
            <option value="public">お座敷一覧に出す（誰でも入店できる）</option>
            <option value="private">一覧に出さない（コードを知っている人だけ）</option>
          </select>
        </div>
        <!-- 承認制は一覧に出す卓にだけ付く（§3.1.1） -->
        <div class="field" id="create-room-entry-mode-field">
          <label for="create-room-entry-mode">入店のしかた</label>
          <select class="input" id="create-room-entry-mode">
            <option value="open">そのまま入ってもらう</option>
            <option value="knock">ノックしてもらい、こちらで通す</option>
          </select>
        </div>
        <!-- 合言葉は招待制の卓にだけ付く。この画面の配線が誰に見せるかで出し入れする -->
        <div class="field hidden" id="create-room-passphrase-field">
          <label for="create-room-passphrase">合言葉（4〜20文字・任意）</label>
          <input
            class="input"
            id="create-room-passphrase"
            minlength="4"
            maxlength="20"
            autocomplete="off"
            placeholder="付けるとコードなしで入れます"
          />
        </div>
        <button id="create-room-submit" class="btn btn-gold btn-block btn-lg" type="button">
          立てる
        </button>
      </div>
    </main>

    <script src="./room-handoff.js"></script>
    <script src="./create-room.js"></script>
  </body>
</html>
