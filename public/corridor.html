<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover: このページは画面いっぱいに描くので、ノッチ・ホームバーの
      内側に収めるための env(safe-area-inset-*) を効かせる必要がある。
      cover が無いと env() は常に 0 を返す。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>宴 -EN- 廊下</title>
    <link rel="stylesheet" href="./assets/en.css" />
    <style>
      /*
       * 廊下ビューの確認用ページ。卓が何百あっても同じ区画を使い回して歩ける、
       * という見せ方だけを切り出してある。3D を index.html から切り離して
       * 単体で確かめられる場所として残してある。
       *
       * 廊下そのものの見た目（バー・札・矢印・スティック・確認）は en.css の
       * 「廊下ビュー」の節に移した。index.html と同じものを2箇所に持たないため。
       * ここに残すのは、このページ固有の「画面いっぱいに敷く」寸法と、
       * 一覧フォールバックの卓カードだけ。
       */

      /*
       * 画面いっぱいに敷く。
       *
       * 100vh はスマホでは「アドレスバーが引っ込んだときの高さ」なので、
       * バーが出ている間はその分だけ画面からはみ出す。実際に見えている高さは 100dvh。
       * 対応していない環境のために 100vh を先に書いて、上書きさせる。
       *
       * min-height ではなく height にして overflow を切るのは、
       * バーが伸びたときにページ全体を伸ばすのではなく、場（stage）を縮めるため。
       */
      body {
        height: 100vh;
        height: 100dvh;
        margin: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* 画面いっぱいのページでは、注記は角丸の箱ではなく帯として敷く */
      .corridor-error {
        flex: none;
        border-width: 0 0 1px;
        border-radius: 0;
      }

      /* ── 一覧フォールバックの卓カード ─────────────── */
      /* 見た目は index.html の卓カードに合わせてある（クラス名も同じ） */
      #rooms-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 18px;
      }

      .rooms-empty {
        grid-column: 1 / -1;
        margin: 0;
        padding: 40px 20px;
        text-align: center;
        font-size: 13px;
        color: var(--dim);
        border: 1px dashed var(--line);
        border-radius: var(--r-lg);
      }

      .room {
        display: flex;
        flex-direction: column;
        padding: 16px 18px 0;
        overflow: hidden;
      }

      .room-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }

      .room-code {
        font-family: var(--serif);
        font-size: 12px;
        letter-spacing: 0.22em;
        color: var(--muted);
      }

      .room h2 {
        font-family: var(--serif);
        font-size: 19px;
        font-weight: 400;
        margin: 0 0 8px;
        color: var(--cream);
        overflow-wrap: anywhere;
      }

      .room-meta {
        margin: 0 0 16px;
        font-size: 12.5px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .room-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 16px;
      }

      .room-seats {
        margin-bottom: 16px;
        font-size: 12.5px;
        color: var(--muted);
      }

      .room-foot {
        display: flex;
        align-items: stretch;
        margin: auto -18px 0;
        border-top: 1px solid var(--line-soft);
      }

      .room-foot .btn {
        flex: 1;
        min-height: 44px;
        border: none;
        border-radius: 0;
        font-family: var(--serif);
        letter-spacing: 0.4em;
        text-indent: 0.4em;
        padding: 13px;
      }

      .room-since {
        display: flex;
        align-items: center;
        padding: 0 14px;
        font-size: 11.5px;
        color: var(--dim);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="corridor-bar">
      <!-- 卓の一覧ページへ戻る -->
      <a id="to-index" class="btn" href="/index.html">一覧で選ぶ</a>
      <a id="create-room-link" class="btn hidden" href="/create-room.html">卓を立てる</a>

      <h1>宴 -EN-</h1>

      <div id="walk-controls" class="corridor-group">
        <button id="left" class="btn" type="button">左を向く</button>
        <button id="back" class="btn" type="button">下がる</button>
        <button id="fwd" class="btn" type="button">進む</button>
        <button id="right" class="btn" type="button">右を向く</button>
        <button id="enter" class="btn btn-gold" type="button" disabled>この卓に入る</button>
      </div>

      <span id="count" class="corridor-hint"></span>
      <span id="account-status" class="corridor-hint"></span>
      <!-- index.html と同じ並び順（名札を固定位置にし、のれんをくぐる／お会計を
           その後ろで入れ替える）にしてある -->
      <a id="profile-link" href="/profile.html" class="btn">名札</a>
      <a id="login-link" href="/login.html" class="btn hidden">のれんをくぐる</a>
      <button id="logout" type="button" class="btn hidden">お会計</button>
    </div>

    <p id="error" class="corridor-error hidden"></p>

    <div id="stage" class="corridor-stage">
      <div class="corridor-aim" aria-hidden="true"></div>

      <div id="signs" class="corridor-layer" role="group" aria-label="いま見えている卓の札"></div>
      <div id="edges" class="corridor-layer" role="group" aria-label="画面の外にある卓"></div>

      <div class="corridor-layer">
        <p id="signs-note" class="corridor-note"></p>

        <div class="corridor-focus">
          <h2 id="focus-name">—</h2>
          <p id="focus-meta" aria-live="polite">通りかかった扉の札がここに出ます</p>
        </div>

        <div id="stick" class="corridor-stick" aria-hidden="true">
          <div id="stick-knob" class="corridor-stick-knob"></div>
          <span class="corridor-stick-label">歩く</span>
        </div>
      </div>
    </div>

    <section id="list-view" class="corridor-list hidden" aria-label="卓の一覧">
      <div id="rooms-list"></div>
    </section>

    <dialog id="confirm" class="corridor-confirm card" aria-labelledby="confirm-name">
      <h2 id="confirm-name"></h2>
      <p id="confirm-state"></p>
      <p id="confirm-meta"></p>
      <p id="confirm-since"></p>
      <div class="corridor-confirm-foot">
        <button id="confirm-cancel" class="btn" type="button">やめる</button>
        <button id="confirm-ok" class="btn btn-gold" type="button">入店する</button>
      </div>
    </dialog>

    <script src="./assets/sound/sound.js"></script>
    <script src="./room-handoff.js"></script>
    <script type="module" src="./corridor.js"></script>
  </body>
</html>
